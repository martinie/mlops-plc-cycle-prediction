name: Docker Build

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "app/**"
      - "src/**"
      - "data/raw/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build and smoke test Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/plc-cycle-api" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Run container smoke test
        run: |
          docker run -d --name plc-cycle-api-test -p 8080:8080 $IMAGE_NAME:latest
          sleep 10
          curl --fail http://127.0.0.1:8080/health
          docker stop plc-cycle-api-test

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        run: docker push $IMAGE_NAME:latest
