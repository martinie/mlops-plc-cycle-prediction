name: CI

on:
  push:
    branches:
      - dev
      - main
      - "feature/**"
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run preprocessing, training smoke test, and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run preprocessing
        run: python -m src.preprocess

      - name: Run training
        run: python -m src.train

      - name: Run tests
        run: pytest
