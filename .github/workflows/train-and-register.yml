name: Train and Register Model

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  train:
    name: Preprocess data, train models, log MLflow runs, and upload artefacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run preprocessing
        run: python -m src.preprocess

      - name: Train and register models with MLflow
        run: python -m src.train

      - name: Upload model and report artefacts
        uses: actions/upload-artifact@v4
        with:
          name: model-training-artefacts
          path: |
            models/
            reports/
            mlruns/
